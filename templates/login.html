<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AI Disaster Response EOC</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom High-Contrast EOC CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex align-items-center min-vh-100 py-5 bg-dark">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <div class="text-center mb-4">
                    <i class="bi bi-shield-radar text-warning display-3"></i>
                    <h2 class="text-white fw-bold mt-2">EOC Command Portal</h2>
                    <p class="text-warning font-mono fs-7">AI Disaster Response Coordinator Authentication</p>
                </div>

                <div class="glass-panel p-4 border-start border-4 border-warning">
                    
                    {% if error %}
                    <div class="alert alert-danger font-mono fs-7 mb-3" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
                    </div>
                    {% endif %}

                    <!-- Standard Login Form -->
                    <form action="/login" method="POST" id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label text-white font-mono fs-7">Official Email:</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark text-warning border-secondary"><i class="bi bi-envelope-fill"></i></span>
                                <input type="email" class="form-control bg-dark text-white border-secondary" id="email" name="email" placeholder="name@eoc.gov" required autocomplete="username">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label text-white font-mono fs-7">Security Key / Password:</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark text-warning border-secondary"><i class="bi bi-key-fill"></i></span>
                                <input type="password" class="form-control bg-dark text-white border-secondary" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-warning w-100 font-mono fw-bold py-2 mb-3">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Authenticate to Dashboard
                        </button>
                    </form>

                    <div class="text-center my-3 border-top border-secondary pt-3">
                        <small class="text-white font-mono fs-8 d-block mb-2">PROTOTYPE DEMO ACCOUNTS (ONE-CLICK LOGIN)</small>
                    </div>

                    <!-- Quick Demo Credentials Buttons -->
                    <div class="d-flex flex-column gap-2">
                        <button type="button" class="btn btn-outline-danger font-mono fw-bold text-white text-start d-flex justify-content-between align-items-center p-2" onclick="quickLogin('admin@eoc.gov', 'admin123')">
                            <div>
                                <i class="bi bi-shield-lock-fill text-danger me-2"></i>
                                <span>Log in as Admin Commander</span>
                            </div>
                            <span class="badge bg-danger text-white fs-8">admin@eoc.gov</span>
                        </button>

                        <button type="button" class="btn btn-outline-info font-mono fw-bold text-white text-start d-flex justify-content-between align-items-center p-2" onclick="quickLogin('user@eoc.gov', 'user123')">
                            <div>
                                <i class="bi bi-person-fill text-info me-2"></i>
                                <span>Log in as Regular Field User</span>
                            </div>
                            <span class="badge bg-cyan text-dark fs-8">user@eoc.gov</span>
                        </button>
                    </div>

                    <div class="text-center mt-3">
                        <a href="/" class="text-warning text-decoration-none font-mono fs-7">
                            <i class="bi bi-arrow-left me-1"></i> Return to Public Emergency Dashboard
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        function quickLogin(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
            document.getElementById('loginForm').submit();
        }
    </script>
</body>
</html>
